<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbleiis Socials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0e;
    --bg-glow: #2a0d11;
    --ink: #0b0b0e;
    --paper: #ecebe8;
    --accent: #d0191f;
    --muted: #9b979d;
    --shadow: #d0191f;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-glow) 0, transparent 70%),
      radial-gradient(ellipse at 50% 50%, transparent 40%, #000 120%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
    color: var(--paper);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 480px;
    padding: 72px 20px 48px;
    position: relative;
    z-index: 2;
  }

  header { text-align: center; margin-bottom: 36px; }

  .avatar {
    width: 112px; height: 112px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--ink);
    border: 3px solid var(--paper);
    box-shadow: 5px 5px 0 var(--shadow);
    display: grid; place-items: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 52px;
    overflow: hidden;
    transform: rotate(-4deg);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 11vw, 56px);
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .tagline {
    margin: 0 auto;
    max-width: 34ch;
    color: var(--muted);
  }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }

  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--paper);
    color: var(--ink);
    text-decoration: none;
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 5px 5px 0 var(--shadow);
    font-family: var(--display);
    font-weight: 800;
    font-size: 19px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.link:hover, a.link:focus-visible {
    transform: translate(3px, 3px);
    box-shadow: 2px 2px 0 var(--shadow);
  }
  a.link:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }

  .icon {
    flex: none;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    transform: rotate(-4deg);
    transition: transform .15s ease, color .15s ease;
  }
  a.link:hover .icon, a.link:focus-visible .icon { transform: rotate(4deg) scale(1.06); color: var(--accent); }
  .label { flex: 1; }
  .hint {
    font-family: var(--body);
    font-weight: 500;
    font-size: 14px;
    opacity: .65;
  }

  /* Hauptlink hervorgehoben */
  a.link.primary { background: var(--accent); color: var(--paper); border-color: var(--paper); }
  a.link.primary .icon { border-color: var(--paper); }
  a.link.primary:hover .icon, a.link.primary:focus-visible .icon { color: var(--paper); }

  footer { margin-top: 40px; text-align: center; font-size: 14px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    a.link, .icon { transition: none; }
  }
